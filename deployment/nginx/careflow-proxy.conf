# Shared proxy headers, installed to /etc/nginx/snippets/careflow-proxy.conf.
# Spring Boot reads the forwarded headers (forward-headers-strategy: framework)
# so generated links and client IPs in logs reflect the original request.

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header Connection        "";

proxy_connect_timeout 10s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;

proxy_buffering on;
proxy_buffer_size 8k;
proxy_buffers 8 8k;
