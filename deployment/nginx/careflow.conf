# Nginx reverse proxy for CareFlow on the GCE VM.
#
# Spring Boot listens on 127.0.0.1:8080 only, so the application port is never
# reachable from the internet; every request arrives through this proxy.

upstream careflow_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# Rate limits protect the credential endpoint from brute-force attempts.
limit_req_zone $binary_remote_addr zone=careflow_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=careflow_api:10m rate=120r/m;

server {
    listen 80;
    server_name ${CAREFLOW_DOMAIN};

    # ACME challenges must stay on HTTP for certificate renewal.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${CAREFLOW_DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${CAREFLOW_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${CAREFLOW_DOMAIN}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 2m;

    access_log /var/log/nginx/careflow-access.log;
    error_log  /var/log/nginx/careflow-error.log warn;

    location /api/auth/ {
        limit_req zone=careflow_auth burst=5 nodelay;
        proxy_pass http://careflow_backend;
        include /etc/nginx/snippets/careflow-proxy.conf;
    }

    location /api/ {
        limit_req zone=careflow_api burst=40 nodelay;
        proxy_pass http://careflow_backend;
        include /etc/nginx/snippets/careflow-proxy.conf;
    }

    location /actuator/health {
        proxy_pass http://careflow_backend;
        include /etc/nginx/snippets/careflow-proxy.conf;
        access_log off;
    }

    # Actuator beyond the health probe stays private to the VM.
    location /actuator/ {
        deny all;
        return 403;
    }

    location /swagger-ui/ {
        proxy_pass http://careflow_backend;
        include /etc/nginx/snippets/careflow-proxy.conf;
    }

    location /v3/api-docs {
        proxy_pass http://careflow_backend;
        include /etc/nginx/snippets/careflow-proxy.conf;
    }
}
